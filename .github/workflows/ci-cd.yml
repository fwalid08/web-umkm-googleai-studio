name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '10.x'

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check migrations sequential & non-empty
        run: |
          set -euo pipefail
          DIR="supabase/migrations"
          echo "→ Listing $DIR:"
          ls -1 "$DIR"
          # Ambil prefix nomor (NNN_) terurut
          nums=$(ls -1 "$DIR" | grep -E '^[0-9]{3}_.*\.sql$' | cut -c1-3 | sort -n)
          if [ -z "$nums" ]; then
            echo "❌ Tidak ada file migrasi NNN_*.sql di $DIR"
            exit 1
          fi
          prev=0
          first=1
          for n in $nums; do
            # hilangkan leading zero untuk aritmetika (10# prefix)
            cur=$((10#$n))
            if [ "$first" -eq 1 ]; then
              if [ "$cur" -ne 1 ]; then
                echo "❌ Migrasi harus mulai dari 001 (ketemu $n)"
                exit 1
              fi
              first=0
            else
              expected=$((prev + 1))
              if [ "$cur" -ne "$expected" ]; then
                printf '❌ Nomor migrasi lompat: setelah %03d, ketemu %03d (harusnya %03d)\n' "$prev" "$cur" "$expected"
                exit 1
              fi
            fi
            prev=$cur
          done
          # Pastikan tidak ada file .sql kosong
          empty=0
          for f in "$DIR"/*.sql; do
            if [ ! -s "$f" ]; then
              echo "❌ File migrasi kosong: $f"
              empty=1
            fi
          done
          if [ "$empty" -eq 1 ]; then exit 1; fi
          # F-fix-3: tolak bare CREATE TRIGGER / CREATE POLICY tanpa guard.
          # Aturan: trigger hanya boleh muncul INDENTED di dalam DO $$ ...
          # IF NOT EXISTS (pg_trigger); policy CREATE harus didahului
          # DROP POLICY IF EXISTS dalam 5 baris sebelumnya.
          # Postgres tidak punya CREATE TRIGGER/POLICY IF NOT EXISTS.
          bad=0
          for f in "$DIR"/*.sql; do
            lineno=0
            # sliding window 5 baris terakhir untuk cek DROP POLICY
            w1=""; w2=""; w3=""; w4=""; w5=""
            while IFS= read -r line || [ -n "$line" ]; do
              lineno=$((lineno + 1))
              case "$line" in
                '--'*) w1="$w2"; w2="$w3"; w3="$w4"; w4="$w5"; w5="$line"; continue;;
              esac
              case "$line" in
                'CREATE TRIGGER '*)
                  echo "❌ $f:$lineno: bare CREATE TRIGGER (bungkus DO \$\$ IF NOT EXISTS pg_trigger)"
                  bad=1;;
                'CREATE POLICY '*)
                  case "$w1 $w2 $w3 $w4 $w5" in
                    *'DROP POLICY IF EXISTS'*) ;;
                    *) echo "❌ $f:$lineno: bare CREATE POLICY (tambahkan DROP POLICY IF EXISTS di atasnya)"; bad=1;;
                  esac;;
              esac
              w1="$w2"; w2="$w3"; w3="$w4"; w4="$w5"; w5="$line"
            done < "$f"
          done
          if [ "$bad" -eq 1 ]; then
            echo "❌ Migrasi mengandung bare CREATE TRIGGER/POLICY — lihat baris di atas"
            exit 1
          fi
          echo "✅ Idempotency lint OK: tidak ada bare CREATE TRIGGER/POLICY."
          count=$(echo "$nums" | wc -l | tr -d ' ')
          last=$(echo "$nums" | tail -1)
          echo "✅ Migrations OK: $count file, berurutan 001..$last, tidak ada yang kosong."

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          # Dummy agar build CI tidak fail saat secrets belum di-set
          # (route billing/status hanya butuh string non-empty saat build;
          # nilai asli dari secrets tetap dipakai saat tersedia).
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          MIDTRANS_SERVER_KEY: dummy
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: dummy

  deploy-preview:
    name: Deploy Preview (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'

  deploy-production:
    name: Deploy Production (Main)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'